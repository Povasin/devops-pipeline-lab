services:
  catalog:
    image: ${IMAGE_REF:?Set IMAGE_REF to an image tag or digest}
    ports:
      - '127.0.0.1:${HOST_PORT:-8080}:8080'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
